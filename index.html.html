<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BMC Medical Center</title>
<style>
:root{--bg:#f2f7fc;--card:#ffffff;--ink:#1c2733;--accent:#0c4a8a;--muted:#5a6b7d;--line:#d9e4f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1824;--ink:#e8eff7;--accent:#6fb6f2;--muted:#9fb1c4;--line:#2a3b4f}}
:root[data-theme="dark"]{--bg:#0e1824;--ink:#e8eff7;--accent:#6fb6f2;--muted:#9fb1c4;--line:#2a3b4f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:480px;margin:0 auto;padding:28px 20px 40px}
.logo{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 14px rgba(12,74,138,.12)}
.logo img{display:block;width:100%;max-width:100%;height:auto}
.card{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;gap:14px;align-items:flex-start;padding:18px;text-decoration:none;color:inherit}
.row+.row{border-top:1px solid var(--line)}
.ico{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px}
:root[data-theme="dark"] .ico{color:#0e1824}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ico{color:#0e1824}}
.lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.val{font-size:18px;line-height:1.4;font-weight:600}
.call{display:block;margin-top:22px;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:15px;border-radius:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .call{color:#0e1824}}
:root[data-theme="dark"] .call{color:#0e1824}
